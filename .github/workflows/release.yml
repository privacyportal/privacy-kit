name: Create Production Release
on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: 'Create release'
    if: github.repository_owner == 'privacyportal' && github.event.repository.name == 'privacy-kit'
    runs-on: ubuntu-latest

    permissions:
      # required by action-gh-release
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Create Tag
        id: create_tag
        uses: butlerlogic/action-autotag@a825539276d173dbaa8d39fb45024d85d292f4f3 # v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          strategy: package
          tag_prefix: 'v'

      - name: Create Release
        if: steps.create_tag.outputs.tagcreated == 'yes'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.create_tag.outputs.tagname }}
          generate_release_notes: true
          files: |
            dist/*.js

      - name: Trigger Workflow
        if: steps.create_tag.outputs.tagcreated == 'yes'
        run: "gh workflow run publish.yml --repo '${{ github.repository_owner }}/${{ github.event.repository.name }}' --ref production -f ref=${{ steps.create_tag.outputs.tagname }}"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets._GITHUB_PERSONAL_ACCESS_TOKEN }}
